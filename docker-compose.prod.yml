# Production-style stack: Postgres, a one-off migration, and the API under gunicorn.
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of port 8000.
services:
  db:
    image: postgres:17
    env_file: .env.prod  # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env.prod
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env.prod
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  media:
