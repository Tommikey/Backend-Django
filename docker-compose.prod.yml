# Production-style stack: Postgres, Redis, a one-off migration, the API under gunicorn, a
# background worker and the scheduler that queues timed work.
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of port 8000.
services:
  db:
    image: postgres:17
    env_file: .env.prod  # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # queued jobs survive a restart
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env.prod
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env.prod
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # runs queued jobs (publishing results, emails); --with-scheduler handles retries
  worker:
    build: .
    env_file: .env.prod
    command: ["python", "manage.py", "rqworker", "default", "--with-scheduler"]
    healthcheck:  # the image's check probes HTTP, which a worker doesn't serve
      test: ["CMD", "python", "manage.py", "workerhealth"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # queues scheduled work (live class reminders, nightly cleanup) for the workers; run one only
  cron:
    build: .
    env_file: .env.prod
    command: ["python", "manage.py", "rqcron", "config.cron"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "workerhealth", "--cron"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
