services:
  db:
    image: postgres:17
    container_name: yap-postgres
    environment:
      POSTGRES_USER: yap
      POSTGRES_PASSWORD: yap
      POSTGRES_DB: yap
    ports:
      - "5433:5432"
    volumes:
      - yap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yap -d yap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yap_pgdata:
    name: yap_pgdata
