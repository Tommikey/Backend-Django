name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yap
          POSTGRES_PASSWORD: yap
          POSTGRES_DB: yap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yap -d yap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # not a real secret; long enough that JWT signing doesn't warn (>= 32 bytes)
      SECRET_KEY: ci-only-insecure-key-used-for-tests-and-nothing-else
      DEBUG: "False"
      DATABASE_URL: postgres://yap:yap@localhost:5432/yap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest -q
